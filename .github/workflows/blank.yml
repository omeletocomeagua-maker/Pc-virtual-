name: PC Virtual Windows

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Informações do PC
        shell: powershell
        run: |
          Write-Host "===== PC VIRTUAL ====="

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host ""
          Write-Host "===== CPU ====="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "===== RAM ====="

          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{
              Name="RAM_GB"
              Expression={[math]::Round($_.TotalPhysicalMemory / 1GB, 2)}
            }

          Write-Host ""
          Write-Host "===== DISCO ====="

          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" |
            Select-Object DeviceID,
              @{Name="Total_GB";Expression={[math]::Round($_.Size / 1GB, 2)}},
              @{Name="Livre_GB";Expression={[math]::Round($_.FreeSpace / 1GB, 2)}}

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP ativado."

      - name: Mostrar IP do Tailscale
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=============================="
          Write-Host " IP DO PC VIRTUAL"
          Write-Host "=============================="

          tailscale ip -4

          Write-Host ""
          Write-Host "=============================="
          Write-Host " PC PRONTO"
          Write-Host "=============================="

      - name: Manter PC ativo
        shell: powershell
        run: |
          Write-Host "PC virtual iniciado."

          while ($true) {
            Write-Host "PC ativo: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
