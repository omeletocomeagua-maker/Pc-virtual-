name: PC Virtual Windows

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar senha do Windows
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
          Write-Host "Senha configurada."

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP ativado."

      - name: Mostrar IP do Tailscale
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=============================="
          Write-Host " IP DO PC VIRTUAL"
          Write-Host "=============================="

          tailscale ip -4

          Write-Host ""
          Write-Host "=============================="
          Write-Host " PC PRONTO"
          Write-Host "=============================="

      - name: Manter PC ativo
        shell: powershell
        run: |
          Write-Host "PC virtual iniciado."

          while ($true) {
            Write-Host "PC ativo: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
